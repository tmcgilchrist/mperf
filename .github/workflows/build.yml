name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml 5.5
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Install with opam, running the tests
        run: opam install . --with-test

      # opam hides a successful build's output; this shows clang's warnings.
      - name: Build, showing C compiler warnings
        run: opam exec -- dune build @install

      - name: Check the installed CLI
        run: opam exec -- mperf-stat --help
