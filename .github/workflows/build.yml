name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build C tool
        run: make

      - name: Set up OCaml 5.3
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - name: Install opam dependencies
        run: opam install . --deps-only

      - name: Build OCaml library
        run: opam exec -- dune build
